[workspace]
resolver = "3"
members = ["crates/dot-sim-math", "crates/dot-sim-arms", "crates/dot-sim-bots", "crates/dot-sim-brain", "crates/dot-sim-snapshot", "crates/dot-sim-interp", "crates/dot-sim-motor", "crates/dot-sim-audio", "crates/dot-sim-crowd", "crates/dot-sim-weapon", "crates/dot-sim-senses", "crates/dot-sim-zombie", "crates/dot-sim-doors", "crates/dot-sim-grid2d", "crates/dot-sim-witches", "crates/dot-sim-doubt", "crates/dot-sim-hazards", "crates/dot-sim-road", "crates/dot-sim-pvs", "crates/dot-sim-route", "crates/dot-sim-gdext"]

exclude = ["vendor/godot-cell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# godot-cell 0.5.5 with one change (see vendor/godot-cell/README.dot-sim.md): a bind under experimental-threads no
# longer wakes condvars nobody waits on, which cost a futex syscall (~2 us on a VM) on every #[func] call.
[patch.crates-io]
godot-cell = { path = "vendor/godot-cell" }
