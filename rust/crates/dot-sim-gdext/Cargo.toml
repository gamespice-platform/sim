[package]
name = "dot-sim-gdext"
description = "The GDExtension: thin engine bindings over the pure crates, one cargo feature per module."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dot_sim"
crate-type = ["cdylib"]

[dependencies]
godot = "0.5.5"
dot-sim-bots = { path = "../dot-sim-bots", optional = true }
dot-sim-brain = { path = "../dot-sim-brain", optional = true }
dot-sim-snapshot = { path = "../dot-sim-snapshot", optional = true }
dot-sim-interp = { path = "../dot-sim-interp", optional = true }
dot-sim-motor = { path = "../dot-sim-motor", optional = true }
dot-sim-arms = { path = "../dot-sim-arms", optional = true }
dot-sim-audio = { path = "../dot-sim-audio", optional = true }
dot-sim-math = { path = "../dot-sim-math", optional = true }
dot-sim-crowd = { path = "../dot-sim-crowd", optional = true }
dot-sim-weapon = { path = "../dot-sim-weapon", optional = true }
dot-sim-senses = { path = "../dot-sim-senses", optional = true }
dot-sim-zombie = { path = "../dot-sim-zombie", optional = true }
dot-sim-doors = { path = "../dot-sim-doors", optional = true }
dot-sim-grid2d = { path = "../dot-sim-grid2d", optional = true }
dot-sim-witches = { path = "../dot-sim-witches", optional = true }
dot-sim-doubt = { path = "../dot-sim-doubt", optional = true }
dot-sim-hazards = { path = "../dot-sim-hazards", optional = true }
dot-sim-road = { path = "../dot-sim-road", optional = true }

# Native brains, aims and motors run on game worker threads (FC bot_threads): without this the
# binding panics off the main thread. Not on the web: its builds are single-threaded.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
godot = { version = "0.5.5", features = ["experimental-threads"] }

[features]
default = ["bots", "brain", "snapshot", "interp", "motor", "arms", "audio", "ragdoll", "killview", "crowd", "weapon", "senses", "zombie", "doors", "grid2d", "witches", "doubt", "hazards", "road"]
bots = ["dep:dot-sim-bots"]
brain = ["dep:dot-sim-brain", "bots"]
snapshot = ["dep:dot-sim-snapshot"]
interp = ["dep:dot-sim-interp"]
motor = ["dep:dot-sim-motor"]
arms = ["dep:dot-sim-arms"]
audio = ["dep:dot-sim-audio"]
ragdoll = ["dep:dot-sim-math"]
killview = ["dep:dot-sim-math"]
crowd = ["dep:dot-sim-crowd", "dep:dot-sim-math"]
weapon = ["dep:dot-sim-weapon"]
senses = ["dep:dot-sim-senses", "dep:dot-sim-math"]
zombie = ["dep:dot-sim-zombie", "dep:dot-sim-math", "crowd"]
doors = ["dep:dot-sim-doors", "dep:dot-sim-math"]
grid2d = ["dep:dot-sim-grid2d"]
witches = ["dep:dot-sim-witches", "dep:dot-sim-math"]
doubt = ["dep:dot-sim-doubt", "dep:dot-sim-math"]
hazards = ["dep:dot-sim-hazards", "dep:dot-sim-math"]
road = ["dep:dot-sim-road", "dep:dot-sim-math"]
# A web side module (wasm32-unknown-emscripten, nightly, -Zbuild-std); see docs/web.md.
web = ["godot/api-custom", "godot/experimental-wasm", "godot/lazy-function-tables"]
web-nothreads = ["web", "godot/experimental-wasm-nothreads"]
